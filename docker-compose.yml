version: "3.9"

services:
  sync-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wb-ozon-sync-v2
    restart: unless-stopped

    # Подтягиваем переменные окружения из локального файла .env
    environment:
      - WB_API_TOKEN=${WB_API_TOKEN}
      - WB_WAREHOUSE_ID=${WB_WAREHOUSE_ID}
      - WB_BASE_URL=${WB_BASE_URL}
      - OZON_CLIENT_ID=${OZON_CLIENT_ID}
      - OZON_API_KEY=${OZON_API_KEY}
      - OZON_BASE_URL=${OZON_BASE_URL}
      - OZON_WAREHOUSE_ID=${OZON_WAREHOUSE_ID:-}
      - ENABLE_WB=${ENABLE_WB:-true}
      - ENABLE_OZON=${ENABLE_OZON:-true}
      - CSV_PATH=/app/stocks.csv
      - DATABASE_PATH=/app/data/stocks.db
      - MAPPING_PATH=/app/mapping.json
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-15}
      - RUN_ON_STARTUP=${RUN_ON_STARTUP:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/sync.log
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

    # Монтируем постоянные диски (Volumes), чтобы логи и БД жили на сервере
    volumes:
      - ./stocks.csv:/app/stocks.csv:rw
      - ./mapping.json:/app/mapping.json:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups

    # Ограничение ресурсов, чтобы провайдер сервера не забанил за перегрузку CPU
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

    # Логирование самого Docker-контейнера (защита от переполнения диска сервера)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
